name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mjcode
          POSTGRES_PASSWORD: mjcode
          POSTGRES_DB: mjcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── T2-4 防再入门禁：git 跟踪的文件里不允许出现 .bak / .deprecated ──
      # 用 git ls-files（而非 find）：只看入库文件，不受 node_modules 等忽略目录干扰；
      # 即便有人 git add -f 绕过 .gitignore，这里也会红。
      - name: No .bak / .deprecated in repo (T2-4)
        run: |
          BAD=$(git ls-files | grep -E '\.bak$|\.deprecated' || true)
          if [ -n "$BAD" ]; then
            echo "禁止提交备份/废弃文件（历史恢复走 git，库内不留 .bak）："
            echo "$BAD"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 服务端：依赖 + 建库 + 启动 + API 冒烟 ──
      - name: Server install
        working-directory: server
        run: |
          npm ci
          cat > .env <<EOF
          PORT=3001
          DATABASE_URL=postgresql://mjcode:mjcode@localhost:5432/mjcode
          JWT_SECRET=ci-secret-not-for-production
          JWT_EXPIRES=1h
          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF

      - name: Server init-db
        working-directory: server
        run: npm run init-db

      # ── 服务端：无数据库依赖的单元回归（鉴权 fail-closed / 小程序绑定 / CRDT）──
      - name: Server unit tests
        working-directory: server
        run: npm test

      # ── 服务端：依赖真实 PG 的云端委派测试 ──
      - name: Server db tests
        working-directory: server
        run: npm run test:db

      - name: Server start & e2e smoke
        run: |
          cd server && npm start &
          sleep 3
          cd desktop && node test/e2e-smoke.mjs

      # ── 桌面端：单元/集成测试（electron stub，无显示依赖；与本地 npm test 同一门禁）──
      - name: Desktop install
        working-directory: desktop
        run: npm ci

      # ── 桌面端：静态检查门禁（P1-6 新增）──
      # ESLint：0 error 硬门禁。warning 不阻断（存量 84 个多为空 catch 的未用参数，
      # 属项目既有风格；后续可分批清零，改 --max-warnings=0 收紧）。
      - name: Desktop lint (ESLint)
        working-directory: desktop
        run: npm run lint

      - name: Desktop tests
        working-directory: desktop
        run: npm test

      # ── 渲染层：类型门禁 + 构建 ──
      - name: Renderer typecheck & build
        working-directory: desktop/renderer
        run: |
          npm ci
          npm run typecheck
          npm run build

      # ── 语法门禁：全部服务端/主进程文件 ──
      - name: Syntax gate
        run: |
          cd server && for f in $(find src -name '*.js'); do node --check "$f"; done
          cd ../desktop && node --check main/main.js && node --check main/preload.js && node --check main/approval.js && node --check main/skills.js && node --check main/sandbox.js && node --check main/github.js && node --check main/scheduler.js && node --check main/localStore.js

  # ═══════════════════════════════════════════
  #  发布 job（P0-G）：tag（v*）触发，三平台 matrix 打包
  #  制品纪律：生产包只从 CI 产出，禁止本地 build 直发
  #  签名（默认关闭，secrets 就位即自动启用，无需改工作流）：
  #    mac: CSC_LINK(p12 base64) + CSC_KEY_PASSWORD + APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID（公证）
  #    win: CSC_LINK(pfx base64) + CSC_KEY_PASSWORD
  #    未配置 secrets 时 electron-builder 自动跳过签名/公证，产出未签名包（CI 仍绿）
  #  上传 GitHub Release：仓库设置 → Variables → 新建 PUBLISH_RELEASE=true
  #    （需先在 GitHub 建好仓库，并把 desktop/package.json 的 publish.owner/repo 改成真实值）
  # ═══════════════════════════════════════════
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ${{ matrix.os }}
    # 自动发布需要写权限：默认 GITHUB_TOKEN 是只读的，缺这段会在 --publish always 时
    # 报 "Resource not accessible by integration"（技术设计文档 X3）
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      # electron-builder 走 GitHub Releases 时需要 token；不注入则 --publish always 必失败
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync version from tag
        working-directory: desktop
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install & build renderer
        working-directory: desktop
        run: |
          npm ci
          cd renderer && npm ci && npm run build

      - name: Package
        working-directory: desktop
        run: npx electron-builder --publish ${{ vars.PUBLISH_RELEASE == 'true' && 'always' || 'never' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJCode-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
